[tool.poetry]
name = "pacs008-mcp"
version = "0.0.8"
description = "Model Context Protocol (MCP) server exposing the pacs008 ISO 20022 FI-to-FI Customer Credit Transfer library as agent tools."
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/sebastienrousseau/pacs008-mcp"
homepage = "https://pacs008.com"
packages = [
    { include = "pacs008_mcp" },
]
include = [
    "pacs008_mcp/py.typed",
]

[tool.poetry.scripts]
pacs008-mcp = "pacs008_mcp.server:main"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pacs008 = ">=0.0.9"
pacs008-loader-mt103 = ">=0.0.1"
mcp = ">=1.2,<2"
# Optional: only needed for the online BIC directory lookup in
# ``verify_bic_online``. Installed via the ``online`` extra.
httpx = { version = ">=0.24,<1", optional = true }

# Transitive, via `mcp` -> `pyjwt[crypto]`. Nothing in this tree
# constrains it, so a resolver is free to pick a version in the
# >=44.0.0,<50.0.0 range that GHSA flags as high severity. Floored
# here so the patched line is the only resolvable one; the pins in
# requirements/ already sit at 50.0.0.
cryptography = ">=50.0.0"
[tool.poetry.extras]
# `pip install 'pacs008-mcp[online]'` pulls in httpx so verify_bic_online can
# reach a configured BIC directory endpoint. Core install stays HTTP-free.
online = ["httpx"]

[tool.poetry.group.dev.dependencies]
packaging = ">=23.0"
# `tomllib` is stdlib only from 3.11; the version guard test
# needs a TOML reader on the 3.10 leg of the matrix.
tomli = { version = ">=2.0", python = "<3.11" }
pytest = ">=9.0.3,<10.0.0"
pytest-cov = ">=6.0.0,<8.0.0"
black = "^26.3.1"
ruff = "^0.1.0"
mypy = "^1.11.0"
bandit = "^1.7.0"
# Mocks the httpx transport boundary in the verify_bic_online online-path
# tests (no real network I/O).
respx = ">=0.21,<1"
httpx = ">=0.24,<1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 79
target-version = ['py310']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    "--cov=pacs008_mcp",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true
source = ["pacs008_mcp"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "@overload",
]
fail_under = 100
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 79
target-version = "py310"
extend-exclude = ["*.md", "tmp_env", ".venv", ".eggs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true
exclude = [
    "tmp_env/",
    ".venv/",
    ".eggs/",
]

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pacs008.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pacs008_loader_mt103.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# httpx is an optional (``online`` extra) lazy import inside verify_bic_online;
# tolerate its absence so type-checking passes without the extra installed.
module = "httpx.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The tools wrap the (untyped) pacs008 library verbatim, returning bare
# dict/list/str. Relax the two strict checks that signature would trip
# (generic dict/list args and Any propagated from the library) while keeping
# the rest of strict mode in force.
module = "pacs008_mcp.*"
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_unused_ignores = false
disable_error_code = ["arg-type", "return-value", "attr-defined", "assignment"]
