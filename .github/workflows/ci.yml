name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Installs this package editable (so coverage collects). Its runtime
      # dependencies and the test toolchain come hash-pinned from
      # requirements/ci.txt; the package itself goes on with --no-deps
      # --no-build-isolation, so its build backend comes from ci.txt too.
      - name: Install this package
        run: |
          pip install --require-hashes -r requirements/ci.txt
          pip install --no-deps --no-build-isolation -e .

      - name: Run tests
        run: pytest tests/ -v --tb=short

      # Not a timing gate -- wall-clock is not comparable between
      # runners. This proves the benchmark still runs against the
      # current API rather than rotting into a file that reads as
      # verified and is not.
      - name: Run the benchmark
        run: python benches/bench_tool_dispatch.py --quick

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Install this package so mypy can resolve the `pacs008` imports; the
      # toolchain and runtime dependencies come hash-pinned.
      - name: Install this package
        run: |
          pip install --require-hashes -r requirements/ci.txt
          pip install --no-deps --no-build-isolation -e .

      - name: Ruff check
        run: ruff check pacs008_mcp/ tests/ benches/ scripts/ fuzz/

      - name: Black check
        run: black --check pacs008_mcp/ tests/ benches/ scripts/ fuzz/

      - name: Mypy
        run: mypy pacs008_mcp/

      - name: Enforce 100% docstring coverage
        run: interrogate -c pyproject.toml pacs008_mcp

      # Cyclomatic, Halstead and length limits against the baseline in the
      # script; cognitive complexity against complexipy-snapshot.json. Both
      # baselines may only shrink.
      - name: Complexity
        run: |
          python scripts/check_complexity.py
          complexipy pacs008_mcp scripts benches examples fuzz tests --max-complexity-allowed 15 --quiet
