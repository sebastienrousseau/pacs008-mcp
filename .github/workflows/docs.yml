name: Deploy Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install the package and the docs toolchain (hash-pinned)
        run: |
          pip install --require-hashes -r requirements/docs.txt
          # A wheel built here, not `pip install .`: Scorecard counts a
          # non-editable install of a directory as unpinned, a local wheel
          # with --no-deps as pinned. The build backend is in the tree above.
          pip wheel --no-deps --no-build-isolation --wheel-dir wheelhouse .
          pip install --no-deps wheelhouse/*.whl

      # -W turns every warning into a failure, so a broken cross-reference
      # or an autodoc import error fails the pull request, not the deploy.
      - name: Build Sphinx documentation
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "docs/_build/html"

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
